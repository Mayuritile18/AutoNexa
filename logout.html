<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoNexa - Logout</title>
    <link rel="stylesheet" href="admin-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<body class="login-body">

<div class="login-container">
    <div class="login-card">

        <div class="login-logo">
            <img src="images/logo.jpg" alt="AutoNexa Logo">
            <h1>Auto<span>Nexa</span></h1>
            <p>Vehicle Automation Management System</p>
        </div>

        <div class="login-heading">
            <i class="fa-solid fa-right-from-bracket"></i>
            <div>
                <h2>Logged Out Successfully</h2>
                <p>You have safely logged out of AutoNexa.</p>
            </div>
        </div>

        <div class="admin-form-group" style="text-align:center; margin-top:24px;">
            <p style="color:#91a9bc; line-height:1.7;">
                Your current AutoNexa session has ended.
                Login again to continue managing customers, vehicles and services.
            </p>
        </div>

        <a href="login.html" class="login-btn" style="display:block; text-align:center; text-decoration:none; margin-top:22px;">
            <i class="fa-solid fa-right-to-bracket"></i>
            Login Again
        </a>
